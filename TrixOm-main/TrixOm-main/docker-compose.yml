version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: omin-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: omin_db
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: omin-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/omin_db
    depends_on:
      - mongodb

volumes:
  mongo-data:
